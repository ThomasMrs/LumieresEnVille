<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHM - Lumières en Ville</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Administration Serveur : Lumières en Ville</h1>
    
    <div class="conteneur-grille">
        
        <div class="bloc">
            <h2>1. Configuration</h2>
            <form action="/ihm/add_config" method="get">
                <label>Taille X : <input type="number" name="nombre_x" value="10" required></label>
                <label>Taille Y : <input type="number" name="nombre_y" value="10" required></label>
                <label>Nb Sémaphores : <input type="number" name="nombre_semaphore" value="4" required></label>
                <label>Nb Robots : <input type="number" name="nombre_robot" value="2" required></label>
                <button type="submit">Appliquer la configuration</button>
            </form>
        </div>

        <div class="bloc">
            <h2>2. Ajouter un Sémaphore</h2>
            <form action="/ihm/add_semaphore" method="get">
                <label>Nom : <input type="text" name="name" required></label>
                <label>Durée (s) : <input type="number" name="duration" value="15" required></label>
                <label>Type : <input type="text" name="type" value="HELICE" required></label>
                <label>Position X : <input type="number" name="coord_x" required></label>
                <label>Position Y : <input type="number" name="coord_y" required></label>
                <button type="submit">Enregistrer Sémaphore</button>
            </form>
        </div>

        <div class="bloc">
            <h2>3. Déployer un Robot</h2>
            <form action="/ihm/add_robot" method="get">
                <label>Nom du Robot : <input type="text" name="name" required></label>
                <label>Vitesse : <input type="number" name="speed" value="1" required></label>
                <label>Position X : <input type="number" name="position_x" value="0" required></label>
                <label>Position Y : <input type="number" name="position_y" value="0" required></label>
                <button type="submit">Déployer Robot</button>
            </form>
        </div>

        <div class="bloc">
            <h2>4. Ajouter une Équipe</h2>
            <form action="/ihm/add_team" method="get">
                <label>Nom de l'équipe : <input type="text" name="name" required></label>
                <label>Adresse IP : <input type="text" name="ip" value="127.0.0.1" required></label>
                <label style="flex-direction: row; align-items: center; cursor: pointer;">
                    <input type="checkbox" name="allowed" value="true" checked> Autoriser l'accès
                </label>
                <button type="submit">Déclarer l'équipe</button>
            </form>
        </div>

        <div class="bloc bloc-special">
            <h2>5. Importer Forme (via CSV)</h2>
            <form action="/ihm/add_shape_csv" method="post" enctype="multipart/form-data">
                <label>Nom de la forme : <input type="text" name="name" required></label>
                <label>Fichier .csv : <input type="file" name="file" accept=".csv" required></label>
                <button type="submit">Uploader le CSV</button>
            </form>
        </div>

    </div>
</body>
</html>
